<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЯСИКО — учёт денег</title>
<meta name="theme-color" content="#C1271B">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ЯСИКО">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Fira+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FBF6EE; --panel:#F3E8D8; --sand:#EADAC4; --line:#E0CDB3;
  --ink:#2A1A17; --muted:#74594D; --red:#C1271B; --red-deep:#8E1B12; --on-red:#FFFFFF;
  --rose:#B66862; --pink:#D9BAAC; --green:#2F6B4B; --warn:#C1271B;
  --display:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;
  --text:'Fira Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 10px 30px rgba(60,30,20,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D1412; --panel:#2A1E1B; --sand:#3A2A25; --line:#4D3A32;
    --ink:#F5E9DB; --muted:#C2AD9D; --red:#FF6B5C; --red-deep:#C1271B; --green:#7CC49A; --warn:#FF8A7D;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#1D1412; --panel:#2A1E1B; --sand:#3A2A25; --line:#4D3A32;
  --ink:#F5E9DB; --muted:#C2AD9D; --red:#FF6B5C; --red-deep:#C1271B; --green:#7CC49A; --warn:#FF8A7D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{height:26px;display:block}
.sp{flex:1}
.month{display:flex;align-items:center;gap:2px}
.month .lbl{font-family:var(--display);font-weight:500;font-size:20px;min-width:136px;text-align:center;letter-spacing:.2px}
.ico{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ico:hover{background:var(--panel)}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* остатки */
.cards{display:grid;gap:12px;margin-top:16px}
.card{position:relative;background:var(--panel);border-radius:18px;padding:16px 18px 14px;border:1px solid var(--line);text-align:left;width:100%}
.card.main{background:var(--sand);padding:18px 20px 16px}
.card h2{margin:0;font:500 15px/1.2 var(--text);color:var(--muted)}
.big{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.05;letter-spacing:.3px;margin:6px 0 8px;color:var(--red)}
.card:not(.main) .big{font-size:34px}
.big.neg{color:var(--warn)}
.sub{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.sub b{font-weight:500;color:var(--ink)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--rose)}
.stamp{position:absolute;right:14px;top:12px;transform:rotate(-5deg);border:2px solid var(--warn);color:var(--warn);border-radius:8px;padding:1px 8px 2px;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.3px;background:transparent}
.card:not(.main) .stamp{font-size:12px;right:10px;top:10px}

/* вкладки */
.tabs{display:flex;gap:22px;margin:22px 0 4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:8px 0 10px;font:500 16px var(--text);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* операции */
.day{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px;font-family:var(--display);font-size:18px;font-weight:500}
.day small{font:400 13.5px var(--text);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;text-align:left}
.row:hover{background:color-mix(in srgb,var(--panel) 60%,transparent)}
.row .l{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:var(--display);font-size:20px;font-weight:500;white-space:nowrap}
.a.in{color:var(--green)}
.pill{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sand);color:var(--ink);vertical-align:1px}
.pill.hur{background:var(--red);color:var(--on-red)}
.pill.art{background:var(--rose);color:#fff}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.banner{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--sand);font-size:14px}

/* по дням */
.scroll{overflow-x:auto;margin:12px -16px 0;padding:0 16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14.5px}
th{font-weight:500;color:var(--muted);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--paper)}
td.neg{color:var(--warn)}
td.in{color:var(--green)}

/* итоги */
.blk{margin-top:22px}
.blk h3{font:500 20px var(--display);margin:0 0 6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.line.g{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sand);margin:-4px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}

/* кнопка и шторка */
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--red);color:var(--on-red);border:0;border-radius:999px;padding:14px 22px;font:500 17px var(--text);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
:root[data-theme="dark"] .fab{background:#C1271B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{background:#C1271B}}
.fab[hidden]{display:none}
.fab:active{background:var(--red-deep)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.veil{position:fixed;inset:0;z-index:40;background:rgba(30,15,10,.5);display:none;align-items:flex-end;justify-content:center}
.veil.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0 0 12px;font:500 24px var(--display)}
.f{margin:0 0 12px}
.f label,.f .cap{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.inp,.sel{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 12px;font:inherit}
.inp.amt{font:600 26px var(--display);padding:8px 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 6px;font-size:14.5px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg.pay button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:13px;font-weight:500}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
:root[data-theme="dark"] .btn.pri{background:#C1271B;border-color:#C1271B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:#C1271B;border-color:#C1271B}}
.btn.del{color:var(--warn);flex:0 0 auto}
.err{color:var(--warn);font-size:14px;min-height:20px;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>

  'Производство':['ЗП Асият','ЗП Микаил','Сырьё','Расходный материал','Аренда','Коммуналка','Аутсорсинг'],
  'Опер':['ЗП Хурулэн','ЗП Мажид','ЗП Артур','ЗП Саид','АХО','Полиграфия','Логистика','Дивиденды','Прочее']
};
const HUR_CATS=['ЗП Асият','ЗП Микаил','Сырьё','Расходный материал','Полиграфия','ЗП Хурулэн','ЗП Мажид','ЗП Саид'];
const PAYERS={hur:'Хурулэн',art:'Артур',co:'Компания'};

const S={txs:[],settings:{openings:{}},month:null,tab:'ops',filter:'all',mode:'local',canWrite:true,loaded:{tx:true,st:true},err:''};
let editing=null, F=null;
const SEED={"txs": [], "settings": {"openings": {}}};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money=n=>{const v=Math.round((+n||0)*100)/100;return (v<0?'−':'')+nf.format(Math.abs(v))+'\u00a0₽'};
const signed=n=>{const v=Math.round((+n||0)*100)/100;return (v>0?'+':v<0?'−':'')+nf.format(Math.abs(v))+'\u00a0₽'};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mKey=d=>d.slice(0,7);
function nextM(k,step){step=step||1;let[y,m]=k.split('-').map(Number);m+=step;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}
function dayLabel(d){const[y,m,dd]=d.split('-').map(Number);const w=new Date(y,m-1,dd).getDay();return dd+' '+MS[m-1]+', '+WD[w]}
function monthLabel(k){const[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y}
function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- расчёты ---------- */
function delta(t){
  const a=+t.amount||0,d={total:0,hur:0,art:0};
  if(t.type==='in'){d.total=a;if(t.cat==='Хурулэн')d.hur=a;if(t.cat==='Артур')d.art=a}
  else{d.total=-a;if(t.payer==='hur')d.hur=-a;if(t.payer==='art')d.art=-a}
  return d;
}
function opening(month,skipOverride){
  const ov=S.settings.openings||{};
  const months=[...Object.keys(ov),...S.txs.map(t=>mKey(t.date)),month].sort();
  const net={};
  for(const t of S.txs){const k=mKey(t.date);const d=delta(t);const n=net[k]||(net[k]={total:0,hur:0,art:0});n.total+=d.total;n.hur+=d.hur;n.art+=d.art}
  let cur=months[0];const c={total:0,hur:0,art:0};
  for(let i=0;i<600;i++){
    const o=ov[cur]||{};
    if(!(skipOverride&&cur===month))for(const p of['total','hur','art'])if(typeof o[p]==='number')c[p]=o[p];
    if(cur===month)return c;
    const n=net[cur];if(n){c.total+=n.total;c.hur+=n.hur;c.art+=n.art}
    cur=nextM(cur);
  }
  return c;
}
function monthData(month){
  const ops=S.txs.filter(t=>mKey(t.date)===month);
  const op=opening(month);
  const sum={in:{total:0,hur:0,art:0},out:{total:0,hur:0,art:0}};
  for(const t of ops){const a=+t.amount||0;if(t.type==='in'){sum.in.total+=a;if(t.cat==='Хурулэн')sum.in.hur+=a;if(t.cat==='Артур')sum.in.art+=a}else{sum.out.total+=a;if(t.payer==='hur')sum.out.hur+=a;if(t.payer==='art')sum.out.art+=a}}
  const close={total:op.total+sum.in.total-sum.out.total,hur:op.hur+sum.in.hur-sum.out.hur,art:op.art+sum.in.art-sum.out.art};
  return{ops,op,sum,close};
}
const sortOps=(a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.ts||0)-(b.ts||0))||(a.id<b.id?-1:1);

/* ---------- хранилище (только в этом браузере) ---------- */
const K={tx:'yasiko_tx',st:'yasiko_st',bk:'yasiko_backup',first:'yasiko_first'};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){S.err='Браузер не даёт сохранить данные. Сделайте резервную копию.';return false}}
function loadLocal(){
  const a=lsGet(K.tx),b=lsGet(K.st);
  if(a===null&&b===null){S.txs=SEED.txs.map(t=>({...t}));S.settings=JSON.parse(JSON.stringify(SEED.settings));persistLocal();lsSet(K.first,String(Date.now()))}
  else{try{S.txs=JSON.parse(a||'[]');S.settings=JSON.parse(b||'{"openings":{}}')}catch(e){S.txs=[];S.settings={openings:{}};S.err='Не удалось прочитать сохранённые данные.'}}
  if(!S.settings||!S.settings.openings)S.settings={openings:{}};
}
function persistLocal(){lsSet(K.tx,JSON.stringify(S.txs));lsSet(K.st,JSON.stringify(S.settings))}
async function saveTx(t){const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);persistLocal();render()}
async function removeTx(id){S.txs=S.txs.filter(x=>x.id!==id);persistLocal();render()}
async function saveSettings(st){S.settings=st;persistLocal();render()}
function backupDue(){
  if(!S.txs.length)return false;
  const last=Math.max(+lsGet(K.bk)||0,+lsGet(K.first)||0);
  return !last||Date.now()-last>14*864e5;
}

/* ---------- отрисовка ---------- */
function stamp(v){return v<0?'<span class="stamp">кассовый разрыв</span>':''}
function balCard(title,val,line,cls,flt){
  return `<${flt?'button':'div'} class="card ${cls||''} ${flt?'click':''}" ${flt?`data-act="flt" data-f="${flt}"`:''}>
    ${stamp(val)}<h2>${esc(title)}</h2>
    <div class="big num ${val<0?'neg':''}">${money(val)}</div>
    <div class="sub num">${line}</div></${flt?'button':'div'}>`;
}
function render(){
  if(!S.month)S.month=mKey(todayStr());
  $('#monthLbl').textContent=monthLabel(S.month);
  $('#fab').hidden=!(S.canWrite&&S.mode!=='wait');
  const app=$('#app');
  const M=monthData(S.month);

  if(S.err)h+=`<div class="banner">${esc(S.err)}</div>`;
  if(!S.txs.length)h+='<div class="banner">Здесь пока пусто. Чтобы загрузить свои данные: шестерёнка вверху → «Загрузить из копии».</div>';
  if(backupDue())h+='<div class="banner">Данные хранятся только в этом браузере. Сохраните резервную копию: значок шестерёнки → «Скачать копию».</div>';
  const mo=(a,b)=>`<span>было <b>${money(a)}</b></span><span>пришло <b>${money(b.i)}</b></span><span>ушло <b>${money(b.o)}</b></span>`;
  h+='<section class="cards">';
  h+=balCard('Общее сальдо (нал + р/с)',M.close.total,mo(M.op.total,{i:M.sum.in.total,o:M.sum.out.total}),'main');
  h+='<div class="duo">';
  h+=balCard('Наличка Хурулэн',M.close.hur,`<span>пришло <b>${money(M.sum.in.hur)}</b></span><span>потратила <b>${money(M.sum.out.hur)}</b></span>`,'','hur');
  h+=balCard('Доход Артура',M.close.art,`<span>пришло <b>${money(M.sum.in.art)}</b></span><span>ЗП <b>${money(M.sum.out.art)}</b></span>`,'','art');
  h+='</div></section>';
  h+=`<nav class="tabs" role="tablist">${[['ops','Операции'],['days','По дням'],['sum','Итоги']].map(([k,l])=>`<button class="tab" role="tab" data-act="tab" data-k="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</nav>`;
  h+=S.tab==='ops'?viewOps(M):S.tab==='days'?viewDays(M):viewSum(M);
  app.innerHTML=h;
}
function viewOps(M){
  const fl=[['all','Все'],['in','Приходы'],['out','Расходы'],['hur','Хурулэн'],['art','Артур']];
  let ops=M.ops.slice();
  if(S.filter==='in')ops=ops.filter(t=>t.type==='in');
  else if(S.filter==='out')ops=ops.filter(t=>t.type==='out');
  else if(S.filter==='hur')ops=ops.filter(t=>delta(t).hur!==0);
  else if(S.filter==='art')ops=ops.filter(t=>delta(t).art!==0);
  let h=`<div class="chips">${fl.map(([k,l])=>`<button class="chip" data-act="flt" data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div>`;
  if(!ops.length)return h+`<div class="empty">${M.ops.length?'Под этот фильтр ничего нет.':'В этом месяце операций ещё нет.'}${S.canWrite?' Нажмите «Операция», чтобы добавить.':''}</div>`;
  const byDay={};ops.sort(sortOps).reverse().forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
  for(const d of Object.keys(byDay).sort().reverse()){
    const net=byDay[d].reduce((s,t)=>s+delta(t).total,0);
    h+=`<div class="day"><span>${dayLabel(d)}</span><small class="num">${signed(net)}</small></div>`;
    for(const t of byDay[d]){
      const isIn=t.type==='in';
      const sub=[t.group,t.note].filter(Boolean).map(esc).join(' · ');
      const pill=!isIn&&t.payer?`<span class="pill ${t.payer==='hur'||t.payer==='art'?t.payer:''}">${PAYERS[t.payer]||''}</span>`:'';
      h+=`<button class="row" data-act="edit" data-id="${esc(t.id)}"><span class="l"><span class="t">${esc(t.cat)}${pill}</span>${sub?`<span class="s" style="display:block">${sub}</span>`:''}</span><span class="a num ${isIn?'in':''}">${isIn?'+':'−'}${nf.format(+t.amount||0)}\u00a0₽</span></button>`;
    }
  }
  return h;
}
function viewDays(M){
  const days={};M.ops.slice().sort(sortOps).forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
  const keys=Object.keys(days).sort();
  if(!keys.length)return '<div class="empty">В этом месяце операций ещё нет.</div>';
  let c={...M.op};
  let h='<div class="scroll"><table><thead><tr><th>День</th><th>Приход</th><th>Расход</th><th>Общее</th><th>Хурулэн</th><th>Артур</th></tr></thead><tbody>';
  for(const d of keys){
    let i=0,o=0;
    for(const t of days[d]){const x=delta(t);c.total+=x.total;c.hur+=x.hur;c.art+=x.art;if(t.type==='in')i+=+t.amount||0;else o+=+t.amount||0}
    const cl=v=>v<0?'neg':'';
    h+=`<tr><td>${dayLabel(d)}</td><td class="num in">${i?nf.format(i):'—'}</td><td class="num">${o?nf.format(o):'—'}</td><td class="num ${cl(c.total)}">${nf.format(c.total)}</td><td class="num ${cl(c.hur)}">${nf.format(c.hur)}</td><td class="num ${cl(c.art)}">${nf.format(c.art)}</td></tr>`;
  }
  return h+'</tbody></table></div><p class="hint">Остатки на конец каждого дня, ₽. Красным — отрицательный остаток.</p>';
}
function viewSum(M){
  if(!M.ops.length)return '<div class="empty">В этом месяце операций ещё нет.</div>';
  let h='';
  const inc={};M.ops.filter(t=>t.type==='in').forEach(t=>inc[t.cat]=(inc[t.cat]||0)+(+t.amount||0));
  const it=M.sum.in.total||1;
  h+='<div class="blk"><h3>Приходы по каналам</h3>';
  for(const k of INCOME.concat(Object.keys(inc).filter(k=>!INCOME.includes(k)))){if(!inc[k])continue;h+=`<div class="line"><span>${esc(k)}</span><span class="num">${money(inc[k])}</span></div><div class="bar"><i style="width:${Math.round(inc[k]/it*100)}%"></i></div>`}
  h+=`<div class="line g"><span>Всего</span><span class="num">${money(M.sum.in.total)}</span></div></div>`;
  const out={};M.ops.filter(t=>t.type==='out').forEach(t=>{const g=t.group||'Без группы';(out[g]=out[g]||{})[t.cat]=((out[g]||{})[t.cat]||0)+(+t.amount||0)});
  h+='<div class="blk"><h3>Расходы по статьям</h3>';
  for(const g of Object.keys(EXP).concat(Object.keys(out).filter(g=>!EXP[g]))){
    if(!out[g])continue;const gs=Object.values(out[g]).reduce((a,b)=>a+b,0);
    h+=`<div class="line g"><span>${esc(g)}</span><span class="num">${money(gs)}</span></div>`;
    for(const k of Object.keys(out[g]).sort((a,b)=>out[g][b]-out[g][a]))h+=`<div class="line"><span style="padding-left:12px;color:var(--muted)">${esc(k)}</span><span class="num">${money(out[g][k])}</span></div>`;
  }
  h+=`<div class="line g"><span>Всего</span><span class="num">${money(M.sum.out.total)}</span></div></div>`;
  const by={hur:0,art:0,co:0};M.ops.filter(t=>t.type==='out').forEach(t=>by[t.payer||'co']=(by[t.payer||'co']||0)+(+t.amount||0));
  h+=`<div class="blk"><h3>Кто платил</h3>${Object.keys(PAYERS).map(k=>`<div class="line"><span>${PAYERS[k]==='Компания'?'Компания (р/с)':PAYERS[k]}</span><span class="num">${money(by[k]||0)}</span></div>`).join('')}</div>`;
  return h;
}

/* ---------- шторка: операция ---------- */
function openSheet(html){$('#sheet').innerHTML=html;$('#veil').classList.add('open')}
function closeSheet(){$('#veil').classList.remove('open');editing=null;F=null}
function defPayer(group,cat){if(cat==='ЗП Артур')return 'art';if(HUR_CATS.includes(cat))return 'hur';return 'co'}
function catOptions(type,sel){
  if(type==='in')return INCOME.map(c=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}</option>`).join('');
  return Object.keys(EXP).map(g=>`<optgroup label="${esc(g)}">${EXP[g].map(c=>{const v=g+'|'+c;return `<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(c)}</option>`}).join('')}</optgroup>`).join('');
}
function openTx(id){
  const t=id?S.txs.find(x=>x.id===id):null;
  editing=id||null;
  const date=t?t.date:(mKey(todayStr())===S.month?todayStr():S.month+'-01');
  F=t?{type:t.type,date:t.date,cat:t.type==='in'?t.cat:(t.group+'|'+t.cat),amount:String(t.amount),payer:t.payer||'co',note:t.note||'',touched:true}
     :{type:'out',date,cat:'Сырьё',amount:'',payer:'hur',note:'',touched:false};

function drawTx(){
  const isOut=F.type==='out';
  openSheet(`<h2>${editing?'Изменить операцию':'Новая операция'}</h2>
  <div class="f"><div class="seg" role="group" aria-label="Тип"><button data-act="ftype" data-v="out" aria-pressed="${isOut}">Расход</button><button data-act="ftype" data-v="in" aria-pressed="${!isOut}">Приход</button></div></div>
  <div class="f"><label for="fAmt">Сумма, ₽</label><input class="inp amt num" id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(F.amount)}"></div>
  <div class="f"><label for="fCat">${isOut?'Статья расхода':'Канал поступления'}</label><select class="sel" id="fCat">${catOptions(F.type,F.cat)}</select></div>
  ${isOut?`<div class="f"><span class="cap">Кто платил</span><div class="seg pay" role="group" aria-label="Кто платил">${[['hur','Хурулэн (нал)'],['art','Артур'],['co','Компания (р/с)']].map(([k,l])=>`<button data-act="fpay" data-v="${k}" aria-pressed="${F.payer===k}">${l}</button>`).join('')}</div><div class="hint">Расход Хурулэн списывается с её налички, расход Артура — с его дохода.</div></div>`:''}
  <div class="f"><label for="fDate">Дата</label><input class="inp" type="date" id="fDate" value="${esc(F.date)}"></div>
  <div class="f"><label for="fNote">Комментарий</label><input class="inp" id="fNote" maxlength="200" value="${esc(F.note)}" placeholder="Необязательно"></div>

}
function readForm(){
  const g=id=>$('#'+id);
  if(g('fAmt'))F.amount=g('fAmt').value;if(g('fCat'))F.cat=g('fCat').value;if(g('fDate'))F.date=g('fDate').value;if(g('fNote'))F.note=g('fNote').value;
}
async function saveForm(){
  readForm();
  const a=parseFloat(String(F.amount).replace(/\s/g,'').replace(',','.'));
  const err=$('#fErr');
  if(!(a>0)){err.textContent='Введите сумму больше нуля.';return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date)){err.textContent='Выберите дату.';return}
  let group='',cat=F.cat;
  if(F.type==='out'){const p=F.cat.split('|');group=p[0];cat=p[1]}
  const old=editing?S.txs.find(x=>x.id===editing):null;
  const t={id:editing||newId(),date:F.date,type:F.type,cat,group,amount:Math.round(a*100)/100,payer:F.type==='out'?F.payer:'',note:F.note.trim(),ts:old&&old.ts?old.ts:Date.now()};
  try{await saveTx(t);S.month=mKey(t.date);closeSheet();render()}
  catch(e){err.textContent='Не удалось сохранить: '+((e&&e.message)||'ошибка доступа')}
}

  <div class="acts"><button class="btn" data-act="json">Скачать копию</button><button class="btn" data-act="import">Загрузить из копии</button></div>
  <div class="acts"><button class="btn" data-act="csv">Таблица операций (CSV)</button></div>`);
}
async function saveOpenings(reset){
  const m=S.month,auto=opening(m,true);const st=JSON.parse(JSON.stringify(S.settings||{openings:{}}));st.openings=st.openings||{};
  if(reset){delete st.openings[m]}
  else{
    const o={};
    for(const p of['total','hur','art']){const v=parseFloat(String($('#o_'+p).value).replace(/\s/g,'').replace(',','.'));if(isNaN(v))continue;if(Math.abs(v-auto[p])>0.004)o[p]=v}
    if(Object.keys(o).length)st.openings[m]=o;else delete st.openings[m];
  }
  try{await saveSettings(st);closeSheet();render()}catch(e){$('#fErr').textContent='Не удалось сохранить: '+((e&&e.message)||'ошибка доступа')}
}
function saveFile(name,text,type){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}
function exportCsv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Дата','Тип','Статья / канал','Группа','Сумма','Кто платил','Комментарий']];
  S.txs.slice().sort(sortOps).forEach(t=>rows.push([t.date,t.type==='in'?'Приход':'Расход',t.cat,t.group||'',t.amount,t.type==='out'?(PAYERS[t.payer]||''):'',t.note||'']));
  saveFile('ясико-операции.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}
function exportJson(){
  const d=new Date(),stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  saveFile('ясико-копия-'+stamp+'.json',JSON.stringify({app:'yasiko',version:1,savedAt:d.toISOString(),txs:S.txs,settings:S.settings},null,1),'application/json');
  lsSet(K.bk,String(Date.now()));render();
}
function importJson(file){
  const err=$('#fErr');
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||d.app!=='yasiko'||!Array.isArray(d.txs))throw new Error('bad');
      const txs=d.txs.filter(t=>t&&t.id&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&(t.type==='in'||t.type==='out')&&isFinite(+t.amount));
      if(!confirm('Заменить текущие данные копией? В копии операций: '+txs.length+'. Текущие данные будут стёрты.'))return;
      S.txs=txs.map(t=>({id:String(t.id),date:t.date,type:t.type,cat:String(t.cat||''),group:String(t.group||''),amount:+t.amount,payer:t.type==='out'?(['hur','art','co'].includes(t.payer)?t.payer:'co'):'',note:String(t.note||''),ts:+t.ts||0}));
      S.settings=d.settings&&d.settings.openings?{openings:d.settings.openings}:{openings:{}};
      persistLocal();closeSheet();render();
    }catch(e){if(err)err.textContent='Этот файл не похож на копию ЯСИКО.'}
  };
  r.readAsText(file);
}

/* ---------- события ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(e.target.id==='veil'){closeSheet();return}
  if(!b)return;
  const a=b.dataset.act;
  if(a==='prev'){S.month=nextM(S.month,-1);render()}
  else if(a==='next'){S.month=nextM(S.month,1);render()}
  else if(a==='tab'){S.tab=b.dataset.k;render()}
  else if(a==='flt'){S.filter=b.dataset.f;S.tab='ops';render()}
  else if(a==='add'){if(S.canWrite)openTx(null)}
  else if(a==='edit'){if(S.canWrite)openTx(b.dataset.id)}
  else if(a==='settings'){openSettings()}
  else if(a==='fclose'){closeSheet()}
  else if(a==='ftype'){readForm();F.type=b.dataset.v;F.cat=F.type==='in'?'OZON':'Производство|Сырьё';if(F.type==='out'&&!F.touched)F.payer='hur';drawTx()}
  else if(a==='fpay'){readForm();F.payer=b.dataset.v;F.touched=true;drawTx()}
  else if(a==='fsave'){saveForm()}
  else if(a==='fdel'){if(editing&&confirm('Удалить эту операцию?')){try{await removeTx(editing);closeSheet();render()}catch(er){$('#fErr').textContent='Не удалось удалить'}}}
  else if(a==='osave'){saveOpenings(false)}
  else if(a==='oauto'){saveOpenings(true)}
  else if(a==='csv'){exportCsv()}
  else if(a==='json'){exportJson()}
  else if(a==='import'){$('#importFile').click()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'){const f=e.target.files&&e.target.files[0];if(f)importJson(f);e.target.value='';return}
  if(e.target.id==='fCat'&&F&&F.type==='out'){readForm();if(!F.touched){const[g,c]=F.cat.split('|');F.payer=defPayer(g,c);drawTx()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- запуск ---------- */
function boot(){
  S.month=mKey(todayStr());
  loadLocal();
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
}
boot();
})();
</script>
